<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-decorations">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <main class="login-container">
        <!-- Tarjeta de Login -->
        <div class="card" id="loginCard">
            <div class="card-header">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </div>
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <!-- Alerta para mensajes de error/éxito -->
            <div class="alert hidden" id="loginAlert" role="alert">
                <span class="alert-icon"></span>
                <span class="alert-message" id="alertMessage"></span>
            </div>

            <form id="loginForm" novalidate>
                <!-- Campo Correo -->
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input 
                            type="email" 
                            id="correo" 
                            placeholder="tu@ejemplo.com" 
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="error-hint" id="correoError"></span>
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="contrasena">Contraseña</label>
                        <a href="#" id="forgotPasswordLink" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input 
                            type="password" 
                            id="contrasena" 
                            placeholder="••••••••" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="togglePasswordBtn" class="toggle-password" title="Mostrar/ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                            <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="error-hint" id="contrasenaError"></span>
                </div>

                <!-- Recordarme -->
                <div class="form-options">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="recordarme">
                        <span>Recordar usuario</span>
                    </label>
                </div>

                <!-- Botón de Entrar -->
                <button type="submit" id="submitBtn" class="btn-primary">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="spinner hidden" id="btnSpinner"></span>
                </button>
            </form>

            <!-- Datos de prueba para el usuario -->
            <div class="demo-box">
                <span class="demo-title">💡 Usuario de prueba:</span>
                <button type="button" class="demo-fill-btn" id="demoFillBtn">
                    <strong>admin@correo.com</strong> / <strong>123456</strong>
                    <small>(Clic para rellenar)</small>
                </button>
            </div>
        </div>

        <!-- Tarjeta de Bienvenida / Sesión Exitosa (oculta inicialmente) -->
        <div class="card hidden" id="dashboardCard">
            <div class="card-header">
                <div class="success-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h2>¡Sesión Iniciada!</h2>
                <p>Has ingresado al sistema con éxito.</p>
            </div>

            <div class="user-profile-preview">
                <div class="avatar" id="userAvatar">A</div>
                <div class="user-details">
                    <span class="user-label">Cuenta activa:</span>
                    <strong class="user-email" id="displayUserEmail">admin@correo.com</strong>
                    <span class="badge">Acceso concedido</span>
                </div>
            </div>

            <button type="button" id="logoutBtn" class="btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
